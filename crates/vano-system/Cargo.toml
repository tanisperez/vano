[package]
name = "vano-system"
description = "What the computer offers to scan: the connected disks, and the WSL 2 distributions on Windows."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Disks through a safe API on every OS: `unsafe` is forbidden in this workspace. Only the disk
# part, the rest of sysinfo is not built.
sysinfo = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
vano-core = { path = "../vano-core" }
vano-scan = { path = "../vano-scan" }

[target.'cfg(windows)'.dependencies]
# The WSL distributions and their virtual disks, from the registry (safe API).
winreg = "0.56"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
