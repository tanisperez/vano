  gl: "Vano non se actualiza só en Linux. Instálao desde os repositorios apt ou dnf e o teu comando de actualización habitual traerá as novas versións. Se usas o tarball, descarga as novas versións desde a páxina de releases."
  it: "Vano non si aggiorna da solo su Linux. Installalo dai repository apt o dnf e il tuo solito comando di aggiornamento porterà le nuove versioni. Se usi il tarball, scarica le nuove versioni dalla pagina delle release."
