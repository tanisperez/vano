  es: "Los volúmenes pueden contener datos que no existen en ningún otro sitio. docker system prune elimina solo lo que no se usa."
  gl: "Os volumes poden conter datos que non existen en ningún outro sitio. docker system prune elimina só o que non se usa."
  it: "I volumi possono contenere dati che non esistono altrove. docker system prune rimuove solo ciò che non è in uso."
