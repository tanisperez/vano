[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.7.0"
ureq = "3.4"
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
fastrand = "2"
pretty_assertions = "1.4"
tempfile = "3"
tiny_http = "0.12"
dirs = "7"
dunce = "1"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations) and cosmic-text (OS language); same versions.
rust-i18n = "4.2"
sys-locale = "0.3"
# Number formatting with CLDR data (compiled data, only the four UI languages are ever asked for).
icu_decimal = { version = "2.3", features = ["alloc"] }
icu_locale_core = "2.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
rustix = { version = "1.1", features = ["fs"] }
trash = "5"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
