[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.7.0"
# The design system and standard components shared with Postino and Nastro. Same gpui-kit pin.
telaio-ui = { git = "https://github.com/tanisperez/telaio", tag = "v0.3.0" }
telaio-update = { git = "https://github.com/tanisperez/telaio", tag = "v0.3.0" }
# The application shell: logging, language, numbers, paths, window bootstrap, About header.
telaio-app = { git = "https://github.com/tanisperez/telaio", tag = "v0.3.0" }
serde = "1"
serde_json = "1"
anyhow = "1"
fastrand = "2"
pretty_assertions = "1.4"
tempfile = "3"
dirs = "7"
dunce = "1"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations); same version.
rust-i18n = "4.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
rustix = { version = "1.1", features = ["fs"] }
trash = "5"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
