<!doctype html>
<!-- The Open Graph card (img/og.png, 1200x630), rendered by og-image.sh. Not published. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: "Geist";
            src: url("../fonts/Geist-Medium.woff2") format("woff2");
            font-weight: 500;
        }
        @font-face {
            font-family: "Geist";
            src: url("../fonts/Geist-SemiBold.woff2") format("woff2");
            font-weight: 600;
        }

        html, body {
            margin: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            position: relative;
            background: radial-gradient(900px 520px at 78% 40%, rgba(91, 99, 230, 0.28), transparent 70%), #15161a;
            color: #e9eaee;
            font-family: "Geist", sans-serif;
        }

        .text {
            position: absolute;
            left: 64px;
            top: 64px;
            width: 440px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 40px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .brand img {
            width: 56px;
            height: 56px;
        }

        h1 {
            margin: 56px 0 0;
            font-size: 54px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: #a3a9ff;
        }

        p {
            margin: 28px 0 0;
            color: #a0a3ae;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
        }

        .shot {
            position: absolute;
            left: 540px;
            top: 78px;
            width: 900px;
        }
    </style>
</head>
<body>
    <div class="text">
        <div class="brand"><img src="../img/logo.svg" alt="">Vano</div>
        <h1>See what fills your disk and <span>clear it safely</span></h1>
        <p>Native, open source, for Linux, Windows and macOS.</p>
    </div>
    <img class="shot" src="../img/hero-dark.webp" alt="">
</body>
</html>
