name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The Linux install script served at vano.tanis.codes/install.sh.
  install-script:
    name: install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck site/install.sh packaging/linux/test-install.sh
      - name: Test
        run: packaging/linux/test-install.sh

  # The documentation and the translated pages build: no broken link, no missing translation.
  website:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the documentation and the translated pages
        run: |
          python3 site/docs-src/build.py
          python3 site/i18n/build.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev \
            libvulkan-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vano-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vano${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
