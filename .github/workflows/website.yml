# Publishes site/ to GitHub Pages (vano.tanis.codes). The site is rebuilt from scratch on every
# run, there is no gh-pages branch (docs/releasing.md).
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site/screenshots holds the screenshot tooling, not pages.
      - name: Assemble the site
        run: rsync -a --exclude screenshots/ --exclude README.md site/ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
