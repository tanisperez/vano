# Publishes site/ to GitHub Pages (vano.tanis.codes). The site is rebuilt from scratch on every
# run, there is no gh-pages branch (docs/releasing.md).
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The documentation pages, sitemap.xml and llms.txt are generated (site/README.md).
      - name: Build the documentation and the translated pages
        run: |
          python3 site/docs-src/build.py
          python3 site/i18n/build.py

      # site/screenshots holds the screenshot tooling, site/docs-src the sources of site/docs and
      # site/i18n the translations of site/es, gl and it, not pages.
      - name: Assemble the site
        run: rsync -a --exclude screenshots/ --exclude docs-src/ --exclude i18n/ --exclude README.md site/ _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
